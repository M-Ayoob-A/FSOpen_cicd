name: Deployment pipeline

on: 
  push:
    branches:
      - main

jobs: 
  deployment_pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: 
          node-version: '24'
      - name: install the dependancies
        run: npm install

      - name: Check style
        run: npm run eslint

      
