name: Periodic Check

on:
  workflow_dispatch:        
  schedule:
    - cron: '0 12 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed app
        uses: Jtalk/url-health-check-action@v3
        with:
          url: https://fs-ci-cd.onrender.com/health
          max-attempts: 3
          retry-delay: 20s
