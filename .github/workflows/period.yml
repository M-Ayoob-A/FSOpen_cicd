name: Periodic Hello

on: 
  workflow_dispatch:
  schedule:
    - cron: '*/15  * * * *'
    
jobs:
  health_check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check if the deployed app is healthy
      uses: jtalk/url-health-check-action@v5
      with: 
        url: https://pokemon-ci-cd.onrender.com
        max-attempts: 3
        retry-delay: 3s
