name: Hello World!

on:
  push:
    branches:
      - main

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: |
          echo "Hello World!"
  show_date_job:
    runs-on: ubuntu-latest
    steps:
      - name: Show date
        run: |
            date
  show_list_job:
    runs-on: ubuntu-latest
    steps:
      - name: Show ls -l
        run: |
            ls -l
